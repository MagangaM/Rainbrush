app = "rainbrush-ussd"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DB_PATH = "/data/relay.db"
  REFRESH_INTERVAL_MS = "10800000"

[mounts]
  source = "rainbrush_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1